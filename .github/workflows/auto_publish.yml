name: Wezip Scheduled Auto Publisher

on:
  schedule:
    # 매주 월요일, 수요일, 금요일 밤 10:00 (KST = UTC 13:00) 주 3회 정기 자동 실행
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    # 언제든 GitHub Actions 웹 화면에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run automated column publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_publish_column.py

      - name: Verify all pages integrity and site health audit
        run: |
          python verify_all_pages.py
          python scripts/site_health_audit.py
          python scripts/auto_publish_column.py --verify-catalog

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto: Publish scheduled financial column and update sitemap/rss [skip ci]"
            git push origin main
          fi
