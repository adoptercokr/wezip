name: Wezip Approved Column Publisher (Manual Dispatch Only)

on:
  workflow_dispatch:
    # 대표님 사전 검수 및 승인 후 수동 실행 전용 (무단 자동 배포 방지)

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify all pages integrity and site health audit
        run: |
          python verify_all_pages.py
          python scripts/site_health_audit.py
          python scripts/auto_publish_column.py --verify-catalog
